[package]
name = "learning-hub"
version = "0.1.0"
description = "러닝허브 — 볼트·Anki·일과를 한눈에 보는 로컬 학습 대시보드"
authors = ["jin"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
# main.rs 가 이 이름으로 부른다. 모바일 타깃(cdylib/staticlib)은 tauri 2 스캐폴드 기본값 유지.
name = "learning_hub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
# 폴더 선택(워크스페이스 경로 설정) — 1단계 신설 작업의 UI 진입점.
tauri-plugin-dialog = "2"
# SQLite 데이터 모델(2단계). sqlite 피처만 — mysql/postgres 는 이 앱에 값이 0이고
# 링크 부피만 늘린다. 마이그레이션은 Rust 쪽에서 선언한다(프런트가 DDL 을 못 바꾸게).
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
# 볼트 파일 감시(3단계). File System Access API 엔 watch 가 없어 브라우저에선 원리적으로
# 불가능했던 기능이고, 설계 §10 이 OPFS 대안을 탈락시킨 근거이기도 하다.
notify = "8"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
# 러닝허브_실행.bat 의 "포트 8000 stale 서버 강제종료"를 대체 — 두 번째 실행은 기존 창을 깨운다.
tauri-plugin-single-instance = "2"
