[package]
name = "learning-hub"
version = "0.4.0"
description = "러닝허브 — 볼트·Anki·일과를 한눈에 보는 로컬 학습 대시보드"
authors = ["jin"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
# main.rs 가 이 이름으로 부른다. 모바일 타깃(cdylib/staticlib)은 tauri 2 스캐폴드 기본값 유지.
name = "learning_hub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
# ⚠ preserve_order 필수(5단계-C). 기본 BTreeMap 은 객체 키를 사전순으로 재배열하는데,
#   `rows.rs` 의 `present` 배열이 AppState 키 순회 순서를 그대로 싣고 그게 meta 에 JSON
#   문자열로 저장된다 → 순서가 달라지면 diff 가 매번 "변경됨"으로 판정해 쓸데없는 쓰기가 난다.
#   왕복 동형(I1)도 키 순서 보존에 기댄다.
serde_json = { version = "1.0", features = ["preserve_order"] }
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
# 5단계-C — 매퍼가 TS 의 `Map`(삽입 순서)과 같은 순서를 내야 5-D 대조가 단순해진다.
# serde_json 의 preserve_order 가 이미 끌고 오는 크레이트라 새 트리가 생기지 않는다.
indexmap = "2"
# ⚠ `tray-icon` 은 T-3(상주 트레이)에서 켰다 — `tauri::tray` 모듈 전체가 이 피처 뒤에 있다
#   (없으면 `unresolved import tauri::tray`). 이미지 디코딩이 딸려 오므로 트레이를 지우면
#   이 피처도 함께 지울 것.
tauri = { version = "2.11.3", features = ["tray-icon"] }
tauri-plugin-log = "2"
# 폴더 선택(워크스페이스 경로 설정) — 1단계 신설 작업의 UI 진입점.
tauri-plugin-dialog = "2"
# SQLite 데이터 모델(2단계). sqlite 피처만 — mysql/postgres 는 이 앱에 값이 0이고
# 링크 부피만 늘린다. 마이그레이션은 Rust 쪽에서 선언한다(프런트가 DDL 을 못 바꾸게).
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
# 볼트 파일 감시(3단계). File System Access API 엔 watch 가 없어 브라우저에선 원리적으로
# 불가능했던 기능이고, 설계 §10 이 OPFS 대안을 탈락시킨 근거이기도 하다.
notify = "8"
# HTTP — 로컬 Ollama(4단계-E)와 Google 뉴스 RSS(4단계-F).
# ⚠ 4-E 에선 TLS 를 껐다("대상이 127.0.0.1:11434 고정이라 필요 없다"). **4-F 에서 되살렸다** —
#   뉴스 프록시 대상이 `https://news.google.com` 이라 TLS 없이는 원리적으로 못 붙는다
#   (serve.js 도 이것 때문에 `http` 와 `https` 를 둘 다 require 했다 — L24-25).
#   native-tls 가 아니라 rustls 를 쓰는 이유는 Windows 빌드에 openssl 툴체인을 들이지 않기 위함.
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = "0.3"
# 스트림의 '무소식 90초' 타임아웃(4-E) + 5단계 모바일 서버의 런타임.
# ⚠ 5단계-A 에서 피처가 늘었다: 서버가 자체 멀티스레드 런타임을 전용 스레드에 세우고
#   (`server.rs`), graceful shutdown 신호에 oneshot 을 쓴다.
tokio = { version = "1", features = ["time", "rt-multi-thread", "net", "sync"] }
# 5단계-A — LAN 읽기 전용 모바일 뷰의 HTTP 서버.
# ⚠ 4단계-G 가 "리슨하는 포트 0"을 성과로 기록했고 이건 그 결정을 부분적으로 되돌린다.
#   근거와 대가는 `server.rs` 머리주석 · 설계 §5단계-0 참조(기본 OFF · 쿠키 없음 · 쓰기 라우트 없음).
# tiny_http 가 아니라 axum 인 이유: 착수 전 결정 1(sqlx 직접 읽기)이 어차피 tokio 런타임을
#   끌고 오므로, 블로킹 서버를 쓰면 **런타임이 둘로 갈린다**. SSE 라이브 갱신과 뒤의
#   클라우드 푸시(reqwest 보유)까지 같은 스택에서 처리된다.
axum = "0.8"
# 토큰 생성용 CSPRNG. rustls 가 이미 끌고 오는 크레이트라 새 트리가 생기지 않는다.
getrandom = "0.2"
# 5단계-B — 모바일 서버가 앱 DB 를 **읽기 전용**으로 연다.
# ⚠ tauri-plugin-sql 이 이미 sqlx 0.8 을 쓰지만 그 풀은 **프런트가 소유**한다(Rust 에서 못 꺼낸다)
#   → 같은 파일을 여는 두 번째 풀이 된다. 안전한 이유는 실측이다: 앱 실행 중 `-wal`·`-shm` 이
#   존재해 DB 가 WAL 모드이고(설계 §5-0-4), WAL 은 읽기가 쓰기를 막지 않는다.
#   버전을 0.8 로 맞춰 플러그인과 **같은 sqlx 를 공유**한다(둘로 갈리면 링크 부피가 두 배).
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio"] }
tauri-plugin-notification = "2.3.3"
tokio-tungstenite = { version = "0.29.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
# 러닝허브_실행.bat 의 "포트 8000 stale 서버 강제종료"를 대체 — 두 번째 실행은 기존 창을 깨운다.
tauri-plugin-single-instance = "2"
# 자동 업데이트(2026-07-25). **관측(텔레메트리)의 짝**이다 — 그것 없이 이것만 있으면 고칠
# 것을 모른 채 배포 경로만 있고, 이것 없이 그것만 있으면 **결함을 알게 됐는데 전달할 방법이
# 없다.** 종전이 후자였다: 배포가 NSIS 수동 재설치뿐이었다.
# ⚠ 데스크톱 전용 블록에 둔다 — 모바일 타깃엔 스토어가 그 역할을 한다.
# ⚠ 네트워크는 **Rust 가 낸다**. 웹뷰는 CSP `connect-src 'self' ipc:` 라 밖으로 못 나가고,
#   그 규약("셸에서 외부로 나가는 연결이 하나도 없다")은 cloud.rs·news.rs 와 동일하다.
tauri-plugin-updater = "2"

# 자동 시작(T-3 · 2026-08-02) — **상주 트레이의 짝**. 트레이만 있으면 "창을 닫아도 살아 있다"
# 까지이고, 재부팅 뒤 다시 살아나려면 사용자가 앱을 열어야 한다. 그러면 T-6(예약 한 발)이
# 원리적으로 못 선다: `tauri-plugin-notification` 에 **스케줄 API 가 없어**(v2 문서 확인
# 2026-08-02) 발사 시각에 프로세스가 살아 있어야 하기 때문이다.
# ⚠ **기본 꺼짐이다.** 사용자가 설정에서 켜야 등록된다 — 설치만으로 자동 시작을 켜는 것은
#   사용자가 안 본 사이에 시스템 상태를 바꾸는 것이고, 이 앱은 그 형태를 금지한다.
# ⚠ 데스크톱 전용 블록 — 모바일엔 개념이 없다.
tauri-plugin-autostart = "2"

# 전역 단축키(E20 · 2026-07-30) — 앱이 포커스가 아닐 때도 캡처 입구를 연다.
# ⚠ 새 창·새 WebView 를 만들지 않으므로 SQLite 커넥션·부팅 순서·single-instance 계약은 그대로다.
tauri-plugin-global-shortcut = "2"
