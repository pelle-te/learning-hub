[package]
name = "learning-hub"
version = "0.1.0"
description = "러닝허브 — 볼트·Anki·일과를 한눈에 보는 로컬 학습 대시보드"
authors = ["jin"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
# main.rs 가 이 이름으로 부른다. 모바일 타깃(cdylib/staticlib)은 tauri 2 스캐폴드 기본값 유지.
name = "learning_hub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
# 폴더 선택(워크스페이스 경로 설정) — 1단계 신설 작업의 UI 진입점.
tauri-plugin-dialog = "2"
# SQLite 데이터 모델(2단계). sqlite 피처만 — mysql/postgres 는 이 앱에 값이 0이고
# 링크 부피만 늘린다. 마이그레이션은 Rust 쪽에서 선언한다(프런트가 DDL 을 못 바꾸게).
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
# 볼트 파일 감시(3단계). File System Access API 엔 watch 가 없어 브라우저에선 원리적으로
# 불가능했던 기능이고, 설계 §10 이 OPFS 대안을 탈락시킨 근거이기도 하다.
notify = "8"
# 로컬 Ollama HTTP(4단계-E). **TLS 피처를 끈다** — 대상이 127.0.0.1:11434 고정이라 필요가 없고,
# 켜면 openssl/rustls 가 통째로 링크돼 빌드 시간과 바이너리만 커진다. serve.js 도 `http` 모듈만
# 썼으므로(https 아님) 동등하다. stream = NDJSON 을 청크 단위로 받기 위한 것.
reqwest = { version = "0.12", default-features = false, features = ["json", "stream"] }
futures-util = "0.3"
# 스트림의 '무소식 90초' 타임아웃 — 총 시간이 아니라 유휴로 재는 게 serve.js 의 계약이다.
tokio = { version = "1", features = ["time"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
# 러닝허브_실행.bat 의 "포트 8000 stale 서버 강제종료"를 대체 — 두 번째 실행은 기존 창을 깨운다.
tauri-plugin-single-instance = "2"
