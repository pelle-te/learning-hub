[package]
name = "learning-hub"
version = "0.1.0"
description = "러닝허브 — 볼트·Anki·일과를 한눈에 보는 로컬 학습 대시보드"
authors = ["jin"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
# main.rs 가 이 이름으로 부른다. 모바일 타깃(cdylib/staticlib)은 tauri 2 스캐폴드 기본값 유지.
name = "learning_hub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
# 폴더 선택(워크스페이스 경로 설정) — 1단계 신설 작업의 UI 진입점.
tauri-plugin-dialog = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
# 러닝허브_실행.bat 의 "포트 8000 stale 서버 강제종료"를 대체 — 두 번째 실행은 기존 창을 깨운다.
tauri-plugin-single-instance = "2"
