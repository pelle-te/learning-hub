<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b0d12">
<title>러닝 허브</title>
<!-- 인라인 파비콘(file://에서 favicon.ico 404 콘솔 오류 방지) -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%9A%3C/text%3E%3C/svg%3E">
<!-- manifest는 http/https로 서빙될 때만 JS로 주입(file://에서 fetch 실패 오류 방지) -->
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>📚 러닝 허브</h1>
    <span class="sub">졸업까지 한눈에 · 볼트/Anki 현황을 스케줄로 · 일과 빈 시간 자동 계산</span>
    <span style="flex:1"></span>
    <button class="sm ghost" onclick="toggleTheme()" id="themeBtn" title="라이트/다크 전환" aria-label="테마 전환">🌗</button>
    <button class="sm ghost" onclick="exportICS()" title="캘린더(.ics)로 내보내기 — 일회성 스냅샷. 계획이 바뀌면 다시 내보내 갱신하세요(자동 동기화 아님).">📅 .ics</button>
    <button class="sm ghost" onclick="exportJSON()">내보내기</button>
    <button class="sm ghost" onclick="document.getElementById('imp').click()">가져오기</button>
    <input type="file" id="imp" accept="application/json" style="display:none" onchange="importJSON(this)">
    <button class="sm ghost" onclick="undoLast()" title="초기화/가져오기 직전으로 되돌리기">↩ 되돌리기</button>
    <button class="sm danger ghost" onclick="resetAll()">초기화</button>
  </div>

  <div class="sections" id="sections"></div>
  <div class="nav" id="nav"></div>
  <div id="page"></div>
</div>

<!-- 모듈별 스크립트 (로드 순서 중요: utils → state → scheduler → ui-* → app) -->
<script src="js/utils.js"></script>
<script src="js/state.js"></script>
<script src="js/scheduler.js"></script>
<script src="js/ui-today.js"></script>
<script src="js/ui-schedule.js"></script>
<script src="js/ui-items.js"></script>
<script src="js/ui-routine.js"></script>
<script src="js/ui-stats.js"></script>
<script src="js/ui-review.js"></script>
<script src="js/ui-vault.js"></script>
<script src="js/ui-anki.js"></script>
<script src="js/ui-degree.js"></script>
<script src="js/app.js"></script>
<script>
  /* PWA: http/https로 서빙될 때만 manifest 주입 + 서비스워커 등록(file://에서는 둘 다 오류라 건너뜀). */
  if(location.protocol.startsWith('http')){
    const m=document.createElement('link');m.rel='manifest';m.href='manifest.webmanifest';document.head.appendChild(m);
    if('serviceWorker' in navigator)
      window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
  }
</script>
</body>
</html>
