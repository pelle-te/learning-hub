<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b0d12">
<title>러닝 허브</title>
<!-- 인라인 파비콘(file://에서 favicon.ico 404 콘솔 오류 방지) -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%9A%3C/text%3E%3C/svg%3E">
<!-- manifest는 http/https로 서빙될 때만 JS로 주입(file://에서 fetch 실패 오류 방지) -->
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>📚 러닝 허브</h1>
    <span class="sub">졸업까지 한눈에 · 볼트/Anki 현황을 스케줄로 · 일과 빈 시간 자동 계산</span>
    <span style="flex:1"></span>
    <button class="sm ghost" onclick="toggleTheme()" id="themeBtn" title="라이트/다크 전환" aria-label="테마 전환">🌗</button>
    <div class="menuwrap" id="moreWrap">
      <button class="sm ghost" id="moreBtn" aria-haspopup="true" aria-expanded="false" aria-controls="moreMenu" onclick="toggleMore()" title="데이터·백업 메뉴">⋯ 메뉴</button>
      <div class="menu" id="moreMenu" role="menu" hidden>
        <button type="button" role="menuitem" onclick="closeMore();exportICS()" title="일회성 스냅샷 — 계획이 바뀌면 다시 내보내 갱신(자동 동기화 아님)">📅 캘린더(.ics) 내보내기</button>
        <button type="button" role="menuitem" onclick="closeMore();exportJSON()">💾 데이터 내보내기(백업)</button>
        <button type="button" role="menuitem" onclick="closeMore();document.getElementById('imp').click()">📂 데이터 가져오기</button>
        <button type="button" role="menuitem" onclick="closeMore();undoLast()" title="초기화/가져오기 직전으로 되돌리기">↩ 되돌리기</button>
        <div class="menu-sep" role="separator"></div>
        <button type="button" role="menuitem" class="menu-danger" onclick="closeMore();resetAll()">🗑 전체 초기화…</button>
      </div>
    </div>
    <input type="file" id="imp" accept="application/json" style="display:none" onchange="importJSON(this)">
  </div>

  <div class="nav" id="nav" role="tablist" aria-label="메뉴"></div>
  <div id="page"></div>
</div>

<!-- ES 모듈 단일 진입점. 로컬 서버(http)로 띄워야 동작한다(file:// 더블클릭은 CORS로 막힘):
       node serve.js  →  http://localhost:8000/
     모듈 로드 순서·전역 노출은 js/main.js가 관리한다. -->
<script type="module" src="js/main.js"></script>
<script>
  /* PWA: http/https로 서빙될 때만 manifest 주입 + 서비스워커 등록(file://에서는 둘 다 오류라 건너뜀). */
  if(location.protocol.startsWith('http')){
    const m=document.createElement('link');m.rel='manifest';m.href='manifest.webmanifest';document.head.appendChild(m);
    if('serviceWorker' in navigator)
      window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
  }
</script>
</body>
</html>
