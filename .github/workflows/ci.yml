# 러닝허브 웹앱 품질 게이트 (GitHub Actions).
# web/ 경로 변경 push/PR에 트리거 + 수동 실행(workflow_dispatch).
# (2026-07-12 워크스페이스 재구조화 P1: cowork 모노레포에서 서브모듈로 분리 →
#  경로가 러닝허브/web → web 로 바뀜. 부모 repo의 web-ci를 이관.)
name: web-ci

on:
  push:
    paths: ['web/**', 'src-tauri/**', 'server/**', 'package.json', 'package-lock.json', 'audit-allowlist.json', '.github/workflows/ci.yml']
  pull_request:
    paths: ['web/**', 'src-tauri/**', 'server/**', 'package.json', 'package-lock.json', 'audit-allowlist.json', '.github/workflows/ci.yml']
  # ⚠⚠ **시간이 흐르는 것만으로 참이 바뀌는 게이트가 넷 있다**(O005 · 2026-08-22 운영 축):
  #   ① `npm run audit` ×3(새 CVE 는 코드 변경 없이 나타난다) ② `npm run tauri:deny`(Cargo
  #   advisory DB) ③ `audit-allowlist.json` 의 `재검토` 만료 ④ `a11y.spec.ts` 의 `알려진위반` 만료.
  #   넷 다 push 에만 걸려 있어서 **2026-08-08~20 사이 12일간 어떤 SCA 도 돌지 않았다.**
  #   이 저장소는 같은 형태에 세 번 물렸고 진단은 매번 «CI 엔 있는데 로컬엔 없다» 였다 —
  #   이번 것은 그 변주다: **«양쪽에 다 있는데 시간 축이 없다.»**
  #   ⚠ 무거운 잡(windows 2배 과금)은 스케줄에서 뺀다. 도는 것은 아래 `freshness` 하나다.
  schedule: [{ cron: '0 20 * * *' }] # KST 05:00
  workflow_dispatch: {}

# ⚠⚠ **같은 ref 의 앞선 런은 취소한다**(O017 · 2026-08-22 운영 축). 30일 실측에서 **426 과금분**
#   (전체의 19.9% · 무료 한도의 21%)이 «이미 갈아엎힌 커밋»에 쓰였다 — 2026-08-07 에는 4분 8초
#   사이 push 3회가 각각 완주해 shell-build 만 122 과금분을 냈고 트리에 남은 것은 마지막 커밋
#   하나였다.
#   ⚠ **대가를 명시한다: 중간 커밋은 검증되지 않는다.** 이 저장소는 PR 0 · 브랜치 1 · 전부
#   master 직push 라 트리에 남는 것이 마지막 커밋뿐이고 그 런이 같은 상태를 그대로 덮는다 —
#   «덜 검사한다»가 아니라 **«같은 트리를 한 번만 검사한다»** 이다.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ── 공급망(M-6 · 2026-08-06 감사) ────────────────────────────────────────────────
#
# ⚠⚠ **최소 권한을 명시한다.** `permissions:` 가 없으면 저장소 기본값이 적용되는데, 그 기본값은
#   저장소 설정에 달려 있고(조직/개인 설정에 따라 `contents: write` 까지) **워크플로 파일을 읽어서는
#   알 수 없다.** 즉 이 파일이 자기 권한을 모르는 상태였다. 여기 잡는 전부 *읽기만* 한다 —
#   배포는 하지 않고(릴리스는 로컬 `server npm run deploy`), 아티팩트 업로드는 런타임 토큰을 쓴다.
#
# ⚠ **액션은 SHA 로 핀 고정한다.** `@v4` 는 **움직이는 태그**라 같은 워크플로가 어제와 다른 코드를
#   실행할 수 있다. 이 저장소는 이미 그 판단을 한 번 했다 — gitleaks 를 마켓플레이스 액션 대신
#   *버전 핀 + 체크섬 대조한 릴리스 바이너리*로 받는다(아래 secret-scan 주석). 그 규율이 나머지
#   다섯 액션에는 적용돼 있지 않았다. 뒤 주석의 버전은 사람이 읽기 위한 것이고 **정본은 SHA** 다.
#   갱신은 **Dependabot** 이 SHA 와 주석을 함께 올린다(`.github/dependabot.yml`).
#   ⚠⚠ 종전 이 줄은 «Renovate 가 올린다» 였는데 **그건 34일 · 월요일 5회 동안 한 번도 참이
#   아니었다**(O004 · 2026-08-22 운영 축): 봇 커밋 0 · PR 0 · 이슈 0. 그 결과 위 세 액션이
#   **3 메이저씩 뒤처졌고** 러너가 `Node 20 is being deprecated` 를 찍고 있었다.
#   즉 핀이 «갱신 경로가 있는 고정»이 아니라 **동결**이 돼 있었다. 바꾼 이유와 대가는
#   `dependabot.yml` 머리주석이 SSOT — 요지는 «Dependabot 은 돌면 흔적이 남는다» 이다.
permissions:
  contents: read

jobs:
  # 웹 게이트 — OS 무관이라 ubuntu(저렴). 아래 shell 잡과 **일부러 분리**한다(설계 §6):
  # 린트·타입·테스트는 Rust 툴체인이 필요 없고, windows 러너는 2배 과금이다.
  build-test:
    runs-on: ubuntu-latest
    # ⚠ **`timeout-minutes` 가 네 잡 어디에도 없었다**(O022 · 2026-08-22). 기본값은 **360분**이라
    #   한 잡이 걸리면 그것만으로 월 무료 한도의 36%(windows 는 2배 과금이라 그 이상)를 태운다.
    #   그리고 이 워크플로는 «멈춰서 기다리는» 부류의 실패를 이미 낸 전력이 있다(`a11y.spec.ts` 의
    #   30초 타임아웃 · 큐에 16일 갇힌 런). 값은 30일 실측 최대치 + 여유다.
    timeout-minutes: 20 # 실측 최대 9.0분
    if: github.event_name != 'schedule' # 시간 축 게이트는 아래 freshness 잡이 진다(O005)
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # ⚠⚠ **손으로 박은 `node-version: 22` 였다**(O003 · 2026-08-22 운영 축). `web/.nvmrc` 는
          #   저장소에 있는데 **읽는 것이 아무것도 없어서** 선언과 실행이 갈렸고, 그 틈이 2026-08-20
          #   이후 CI 실패 그 자체였다: `test/observations.test.ts` 가 로컬 Node 24 에서는 통과하고
          #   러너 Node 22 에서는 `Cannot bundle Node.js built-in "node:sqlite"` 로 죽었다
          #   (`node:sqlite` 가 22 의 `builtinModules` 에 없어 vite 가 외부화하지 못한다).
          #   즉 **로컬 게이트 전량 녹색이 CI 녹색을 원리적으로 보장하지 않았다.**
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # SCA — **알려진 CVE 게이트**(2026-07-25 감사). 종전 공급망 방어는 gitleaks(시크릿이 새는가)와
      # 의존성 갱신 봇(의존성이 낡는가) 둘뿐이었고, 그 사이 축이 비어 있었다: *해당하는 CVE 가 들어와도
      # CI 가 통과시킨다*. 실측 시점 web 14건 전부 high 였고 그중 react-router 는 사용자에게
      # 실제 배포되는 의존성이다. ⚠ `npm audit --audit-level=high` 한 줄을 쓰지 않는 이유는
      # audit-gate.mjs 머리주석에 있다(상향 픽스가 없는 항목이 있어 그 형태는 즉시 빨간불 →
      # `|| true` 로 무력화되는 길로 간다). 여기선 사유·만료일 원장으로 판단을 기한부로 만든다.
      - run: npm run audit
      # ⚠ **루트 트리도 본다**(D018 · 2026-08-21 데이터 축). `@tauri-apps/cli` 가 배포 인스톨러를
      # 만들고 `web/scripts/gate.mjs` 가 그 프로세스에 `TAURI_SIGNING_PRIVATE_KEY` 를 넣는다 —
      # 세 트리 중 **비밀을 보는 유일한 트리**가 게이트 밖이었다. 스크립트는 순수 Node 라
      # 루트 의존성 설치가 필요 없다(server 잡의 audit 과 같은 근거).
      - run: npm run audit
        working-directory: .
      - run: npm run lint
      # lint:css — verify 구성요소인데 CI 에만 빠져 있던 비대칭(H5 · 2026-07-26 감사).
      # **format:check 가 여기 빠져 있던 2026-07-16 사고와 같은 형태**이고, 그때 고친 사람이
      # 이 둘(lint:css·knip)은 안 봤다. stylelint 는 CSS 규약(생 hex 금지 · 브레이크포인트 3종)의
      # **유일한 집행자**다 — 규약을 관습에 두면 흘러내린다는 것이 이 저장소의 반복된 결론이다.
      - run: npm run lint:css
      # check:tokens — 정의되지 않은 `var(--x)` 참조(H20). stylelint 는 CSS 만 보므로
      # **TS 문자열 속 토큰**(인라인 style 로 주입되는 색)은 원리적으로 못 본다.
      - run: npm run check:tokens
      - run: npm run typecheck
      # knip — 죽은 export·미사용 의존성. 위와 같은 누락이었다.
      - run: npm run knip
      # format:check — verify 구성요소인데 CI 에만 빠져 있던 비대칭(감사 2026-07-16 ②#29):
      # 포맷 위반이 --no-verify·웹UI 커밋으로 들어오면 CI 가 통과시켰다. codegen:check 는
      # hub 단독 체크아웃엔 부모 스키마가 없어 graceful skip 이라 CI 추가 실익 없음(의도적 제외).
      - run: npm run format:check
      - run: npm run test:coverage
      # ⚠⚠ **여기부터가 폭포 차단 구간이다**(O002 · 2026-08-22 운영 축). 종전엔 `test:coverage` 가
      #   죽으면 아래 다섯이 **전부 skipped** 였고, 그래서 **번들 예산·스모크·a11y 가 2026-08-20
      #   이후 CI 에서 한 줄도 안 돌았다** — 원인은 UI 회귀가 아니라 무관한 vitest 환경 문제(O003)
      #   였는데 관계없는 축 셋이 함께 침묵했다.
      #   이건 새 형태가 아니다: 아래 shell-build 주석이 C2 를 회고하며 *"가장 나쁜 귀결은 이
      #   스텝이 아니라 그 다음이었다 … `npm run e2e` 174케이스가 전부 skipped"* 라 적었는데,
      #   **그때 처방은 `shell-build` 에만 갔다.** `build-test` 는 폭포를 끊는 장치를 한 번도
      #   받은 적이 없다(짝 · R3).
      #   규율: **서로 독립인 축은 각자 돌고, `build` 산출물에 의존하는 것만 게이팅한다.**
      #   `!cancelled()` 이지 `always()` 가 아니다 — 취소(concurrency)에는 따라 멈춰야 한다.
      - id: build
        run: npm run build
        if: ${{ !cancelled() }}
      # 번들 예산 게이트 — 빌드 직후 dist/assets를 gzip으로 재어 청크/총합 상한 초과를 잡는다.
      - run: npm run budget
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
      # Playwright 스모크(시각 비교 없음 → OS 독립적, 안정). 빌드물(dist)을 preview로 띄워 검사.
      # 비주얼 회귀(visual.spec)는 win32 베이스라인이라 CI(ubuntu)서 제외 — 로컬/수동 유지.
      - run: npx playwright install --with-deps chromium
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
      - run: npm run e2e:smoke
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
      # a11y(axe) — 스모크와 같은 이유로 CI 에 든다: **OS 독립적**이다(픽셀 비교가 없고
      # 접근성 트리·계산된 스타일만 본다). 도입 즉시 실제 결함 4종을 잡았다 —
      # 다크 기본 테마에서 검색 입력 글자가 안 보이던 것(대비 1.09:1) 포함.
      # ⚠ 이 잡이 ubuntu 인데 통과하는 것이 정상이다. 시각 회귀만 win32 베이스라인 문제다.
      - run: npm run e2e:a11y
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}

  # ── 시간 축 게이트(O005 · 2026-08-22 운영 축) ─────────────────────────────────
  # ⚠⚠ **여기 있는 것은 «코드가 안 바뀌어도 참이 바뀌는» 검사뿐이다.** 위 잡들과 중복이 아니라
  #   **시제가 다르다**: push 게이트는 «이 커밋이 괜찮은가»를 묻고 이 잡은 «오늘도 여전히
  #   괜찮은가»를 묻는다. 12일간 SCA 0회가 아무 술어도 위반하지 않던 것이 이 잡의 존재 이유다.
  # ⚠ **무거운 것을 여기 넣지 마라.** windows 러너는 2배 과금이고 이 잡은 매일 돈다 —
  #   `tauri:deny`(Cargo advisory)를 넣고 싶어지겠지만 그건 windows 툴체인을 끌어온다.
  #   npm 축 셋만으로 30일 실측 사각(12일)의 대부분이 덮인다.
  freshness:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: web/.nvmrc
      # ⚠ `npm ci` 가 없다 — `audit-gate.mjs` 는 순수 Node 이고 `npm audit` 은 lockfile 만 읽는다
      #   (위 `build-test` 의 루트 audit 이 이미 같은 근거로 설치 없이 돈다).
      - run: npm run audit
        working-directory: web
      - run: npm run audit # 루트 — 서명 개인키를 보는 유일한 트리(D018)
      - run: npm run audit
        working-directory: server
      # ⚠ 시간 축 계기판(O006·O030). `gh` 를 쓰므로 토큰을 넘긴다 — 없으면 그 행은
      #   「모른다」로 남고 조용히 통과하지 않는다(스크립트 머리주석).
      - run: npm run freshness
        working-directory: web
        env:
          GH_TOKEN: ${{ github.token }}

  # 시크릿 스캔 — 설계서 §5-2 가 "인증 자료를 다루기 시작하는데 시크릿 스캔이 없다"고 적은 항목.
  # C-4 로 실제로 그 자료가 생겼다(HUB_SIGNING_KEY·HUB_ADMIN_KEY·리프레시 토큰). 이 저장소가
  # 지키는 규약은 "비밀은 `wrangler secret` 과 `.dev.vars`(gitignore)에만 둔다"인데, 규약을
  # 관습에 두면 흘러내린다는 게 이 저장소의 반복된 결론이다(stylelint 도입 근거와 같다).
  #
  # ⚠ 마켓플레이스 액션(`gitleaks/gitleaks-action`)을 쓰지 않는다 — 시크릿을 보겠다고
  #   저장소 전체를 읽는 서드파티 액션에 권한을 주는 것은 방어와 방향이 반대다. 대신
  #   **버전을 핀 고정한 릴리스 바이너리**를 받아 돈다(체크섬까지 대조). 신뢰면이 늘지 않는다.
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10 # 실측 최대 2.5분
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # 전 이력을 본다 — 지금 지웠어도 과거 커밋에 남아 있으면 유출이다
      - name: gitleaks 설치(버전 핀 + 체크섬 대조)
        run: |
          set -euo pipefail
          VER=8.28.0
          TARBALL="gitleaks_${VER}_linux_x64.tar.gz"
          BASE="https://github.com/gitleaks/gitleaks/releases/download/v${VER}"
          # ⚠⚠ **파일명을 바꿔 받지 말 것**(C2 · 2026-08-01). 종전엔 `-o gitleaks.tar.gz` 로
          #   받아 놓고 `sha256sum -c` 에 **원래 이름이 적힌 줄**을 먹였다 — 그 도구는 줄에
          #   적힌 경로를 열므로 "그런 파일이 없다"로 죽었고, 그래서 이 잡은 **도입 이래
          #   스캔을 한 번도 못 돌렸다**(0회). 대조 자체는 옳았고 이름만 어긋나 있었다.
          curl -sSL --fail -o "${TARBALL}" "${BASE}/${TARBALL}"
          curl -sSL --fail -o checksums.txt "${BASE}/gitleaks_${VER}_checksums.txt"
          # ⚠ 대조를 **실제로** 한다. 안 하면 "핀 고정했다"는 말이 태그만 고정한 것이 된다.
          grep "${TARBALL}" checksums.txt | sha256sum -c -
          tar -xzf "${TARBALL}" gitleaks
          ./gitleaks version
      - name: 스캔
        run: ./gitleaks detect --source . --redact --verbose --exit-code 1

  # 클라우드 백엔드(Cloudflare Worker) — **종전까지 CI 가 전혀 안 돌던 폴더다**(2026-07-20 감사).
  # 워크플로 상단 paths 에 `server/**` 가 없었고 잡도 없어서, 인터넷에 노출되는 코드가
  # 로컬에서만 검증됐다. 인증·입력검증을 다루는 층이라 그 비대칭이 가장 위험한 곳에 있었다.
  #
  # ⚠ `test:roundtrip` 이 이 잡의 핵심이다 — **진짜 workerd + 진짜 D1** 위에서 온보딩→토큰→
  #   push→pull→폐기를 왕복한다. 이 저장소는 "정적 검사 전량 녹색인데 실물에서 죽는" 부류에
  #   네 번 물렸고(2단계 저장·C-4 삭제부활·C-5 CSP·pull 페이지네이션), 그때마다 문서는
  #   "띄워보지 않으면 모른다"고 적었지만 그 층을 만들지는 않았다. 여기가 그 층이다.
  #   ubuntu 로 충분하다(workerd 는 OS 독립적이고 GUI 가 없다).
  cloud-server:
    runs-on: ubuntu-latest
    timeout-minutes: 15 # 실측 최대 2.8분
    if: github.event_name != 'schedule'
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # ⚠⚠ **손으로 박은 `node-version: 22` 였다**(O003 · 2026-08-22 운영 축). `web/.nvmrc` 는
          #   저장소에 있는데 **읽는 것이 아무것도 없어서** 선언과 실행이 갈렸고, 그 틈이 2026-08-20
          #   이후 CI 실패 그 자체였다: `test/observations.test.ts` 가 로컬 Node 24 에서는 통과하고
          #   러너 Node 22 에서는 `Cannot bundle Node.js built-in "node:sqlite"` 로 죽었다
          #   (`node:sqlite` 가 22 의 `builtinModules` 에 없어 vite 가 외부화하지 못한다).
          #   즉 **로컬 게이트 전량 녹색이 CI 녹색을 원리적으로 보장하지 않았다.**
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            web/package-lock.json
      - run: npm ci
      # ⚠ 이 층은 web/ 과 달리 **devDependency 도 신뢰면**이다 — wrangler 가 배포 자격증명을
      # 다룬다. 그래서 원장이 비어 있는 상태를 유지하는 것이 목표다(현재 0건).
      # 스크립트는 ../web/scripts/audit-gate.mjs 를 공유하므로 web 의존성 설치가 필요 없다(순수 Node).
      - run: npm run audit
      # ⚠⚠ **이 잡은 web/ 없이는 원리적으로 못 돈다**(C2 · 2026-08-01). 종전엔 `server/` 만
      #   설치해서 2026-07-19 부터 상시 빨간불이었다(`Cannot find module 'zod/mini'` 외 16).
      #   이유는 이 층의 설계 그 자체다 — server 는 web 의 zod 스키마·테이블 계약을 **문자
      #   그대로 공유**하고(그게 Cloudflare 를 고른 실익이다) `tsconfig.json` 의 include 가
      #   `../web/src/lib/{cloud/contract,cloud/schema,db/rows,persistence}.ts` 를 든다.
      #   즉 "server 만 설치하면 된다"는 전제가 애초에 이 구조와 모순이었다.
      - run: npm ci
        working-directory: web
      # ⚠ 그리고 `test/assets.test.ts` 는 **`../web/dist` 를 요구한다**(정적 자산 라우팅을
      #   진짜 miniflare 로 잰다). 그 파일이 스스로 "없으면 조용히 건너뛰지 않고 시끄럽게
      #   실패한다"고 적어 뒀고, 실제로 그랬다. 빌드가 위 typecheck 보다 먼저다.
      - run: npm run build
        working-directory: web
      # typecheck + format:check + 계약(SQL 의미론) + 왕복(실 workerd·D1)
      - run: npm run verify

  # Tauri 셸 — **windows 전용**. ubuntu 에서는 검증이 원리적으로 불가한 것들이 있다:
  # `killTree`(손자 taskkill /T) · `port_owner_pid`(netstat 파싱) · WebView2 자체가 Windows API 다.
  # 배포 매트릭스는 두지 않는다 — 이 앱은 Windows 단일 타깃이다(설계 §6).
  # ⚠ windows 러너는 2배 과금이라 비용 억제가 설계의 일부다:
  #   · rust-cache 로 의존성 재컴파일을 없앤다(없으면 매번 ~90초 풀빌드)
  #   · ⚠ GitHub 은 **잡별 paths 필터가 없다** — 워크플로 상단 paths 는 워크플로 전체에 걸리므로
  #     `web/**` 만 바뀌어도 이 잡이 돈다. 낭비만은 아니다(번들이 web/dist 를 품으므로 web
  #     변경도 셸 산출물을 바꾼다). 과금이 부담되면 `dorny/paths-filter` 로 잡을 게이팅할 것.
  #   · 트랙 B(e2e:shell)는 **여기서 돌리지 않는다** — 창을 띄우고 python·Ollama 를 실제로
  #     부르는 통합 테스트라 헤드리스 러너에서 flaky 해지기 쉽고, 그 대가로 얻는 신호를 로컬
  #     `/게이트`가 이미 준다. CI 는 "컴파일·린트·번들이 되는가"까지만 책임진다.
  shell-build:
    runs-on: windows-latest
    timeout-minutes: 75 # ⚠ 실측 최대 46분 · windows 는 2배 과금이라 기본 360분이면 720 과금분이다
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # ⚠⚠ **손으로 박은 `node-version: 22` 였다**(O003 · 2026-08-22 운영 축). `web/.nvmrc` 는
          #   저장소에 있는데 **읽는 것이 아무것도 없어서** 선언과 실행이 갈렸고, 그 틈이 2026-08-20
          #   이후 CI 실패 그 자체였다: `test/observations.test.ts` 가 로컬 Node 24 에서는 통과하고
          #   러너 Node 22 에서는 `Cannot bundle Node.js built-in "node:sqlite"` 로 죽었다
          #   (`node:sqlite` 가 22 의 `builtinModules` 에 없어 vite 가 외부화하지 못한다).
          #   즉 **로컬 게이트 전량 녹색이 CI 녹색을 원리적으로 보장하지 않았다.**
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      # ⚠ `@stable` 은 **태그가 아니라 브랜치**다(이 액션은 브랜치 이름으로 툴체인을 고른다) →
      #   핀을 걸면 선택자가 사라지므로 `toolchain:` 을 명시로 옮긴다. 설치되는 Rust 는 여전히
      #   그때의 stable 이다(핀이 얼리는 것은 **액션 코드**이지 툴체인이 아니다).
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 브랜치(2026-08-05)
        with:
          toolchain: stable
          components: rustfmt, clippy
      # windows 러너 과금이 2배라 캐시가 선택이 아니다(설계 §6 명시).
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          # ⚠⚠ **기본은 «잡이 실패하면 캐시를 저장하지 않는다»** 이고, 이 잡은 **마지막 스텝에서**
          #   죽는 전력이 있다(2026-08-21 두 런 연속 · `Post Run rust-cache` 가 둘 다 skipped).
          #   그 결과 캐시가 한 번도 안 채워져 다음 런도 콜드로 돌았다 — CI 가 빨간 동안
          #   `Cargo.lock` 이 바뀌면 **매 런 전량 재컴파일**이다(O018).
          cache-on-failure: true
      # 루트와 web 양쪽 설치가 필요하다: `tauri:*` 는 **루트 스크립트**라 루트의 @tauri-apps/cli 를
      # 쓰고, `tauri:build` 의 beforeBuildCommand(`npm --prefix web run build`)는 web 의존성을 쓴다.
      - run: npm ci
      - run: npm ci
        working-directory: web
      - run: npm run tauri:fmt
      - run: npm run tauri:clippy
      # ⚠⚠ **Cargo 축의 SCA**(D010 · 2026-08-21 데이터 축). 이 워크플로의 SCA 주석이 든 논증
      # (*"해당하는 CVE 가 들어와도 CI 가 통과시킨다"*)이 두 생태계 중 **npm 에만** 적용돼 있었고,
      # 사용자에게 배포되는 exe 를 만드는 645 crate 짜리 축은 어느 쪽(CI·로컬)에도 없었다.
      # 설정과 그 근거(타깃 필터 · `unsound = "all"`)는 `src-tauri/deny.toml` 머리주석이 SSOT.
      # ⚠ 전용 액션(`EmbarkStudios/cargo-deny-action`)을 쓰지 않는 이유는 그대로다 — 이 잡은
      #   **windows-latest** 이고 그 액션은 리눅스 바이너리를 받는 형태다. 그리고 **로컬 게이트와
      #   같은 명령**(`npm run tauri:deny`)을 쓰는 것이 이 저장소의 규율이다.
      #
      # ⚠⚠ **바뀐 것은 «어떻게 설치하나» 다**(O018 · 2026-08-22 운영 축). 종전 주석은
      #   *"rust-cache 가 `~/.cargo/bin` 을 캐시하므로 첫 실행 이후는 사실상 공짜다"* 라
      #   단언했는데 **관측이 정반대였다**: 2026-08-21 두 런이 각각 소스에서 전량 컴파일해
      #   `cargo install cargo-deny` 에 **4분01초 / 4분34초**(합 17.2 과금분)를 썼고 잡은 결함은
      #   **0** 이다. 원인은 위 `cache-on-failure` 주석에 있다.
      #   → 같은 워크플로의 `secret-scan` 이 이미 쓰는 관용구(**버전 핀 + 릴리스 바이너리 +
      #     체크섬 대조**)로 통일한다. 그 주석이 적은 *"신뢰면이 늘지 않는다"* 가 여기도 그대로
      #     적용되고, cargo-deny 는 그 관용구가 요구하는 것을 전부 낸다. 절감 ~9 과금분/런.
      #   ⚠⚠ **`sha256sum -c <파일>` 을 그대로 쓸 수 없다** — 이 프로젝트의 `.sha256` 은 해시
      #     **한 덩어리만**(대문자 · 파일명 없음) 담는다. 그 도구는 `<해시>  <파일명>` 두 열을
      #     요구하므로 줄을 **직접 조립**한다. gitleaks 가 이름 불일치로 도입 이래 0회 돌았던
      #     것과 같은 함정의 다른 얼굴이다(C2) — 그래서 아래는 실측으로 확인한 형태다.
      - name: cargo-deny 설치(버전 핀 + 체크섬 대조)
        shell: bash
        run: |
          set -euo pipefail
          VER=0.20.2
          D="cargo-deny-${VER}-x86_64-pc-windows-msvc"
          BASE="https://github.com/EmbarkStudios/cargo-deny/releases/download/${VER}"
          curl -sSL --fail -o "${D}.tar.gz" "${BASE}/${D}.tar.gz"
          curl -sSL --fail -o "${D}.tar.gz.sha256" "${BASE}/${D}.tar.gz.sha256"
          echo "$(tr 'A-Z' 'a-z' < "${D}.tar.gz.sha256" | tr -d '[:space:]')  ${D}.tar.gz" | sha256sum -c -
          tar -xzf "${D}.tar.gz" --strip-components=1 -C "$USERPROFILE/.cargo/bin" "${D}/cargo-deny.exe"
          cargo deny --version
      - run: npm run tauri:deny
      # Windows 전용 계약(taskkill /T 손자 정리 · WebView2)은 이제 **Rust 쪽에 있다** —
      # `cargo test` 가 위 tauri:clippy 와 같은 잡에서 돈다. 4단계-G 에서 serve.js 와 함께
      # `npm run test -- serve` 를 지웠다(그 26케이스의 처지는 설계 문서 대조표 참조).
      #
      # ⚠⚠ **`LEARNING_HUB_NO_REAL_ENV` 가 이 잡을 13일 만에 되살렸다**(C2 · 2026-08-01).
      #   CI 는 hub 를 **독립 repo 로 체크아웃**하므로 `atelier/{knowledge,pipeline}` 형제
      #   폴더가 원리적으로 없고, 실물 대상 통합 검사 6종이 그 위에 서 있어 2026-07-19 부터
      #   8런 연속 실패였다. **가장 나쁜 귀결은 이 스텝이 아니라 그 다음이었다** — 아래
      #   `tauri:build` 와 **`npm run e2e`(시각 회귀 174케이스)가 전부 skipped** 였다.
      #   즉 2026-07-25 감사가 "UI 안전망이 누가 로컬에서 기억하는가에 걸려 있다"고 진단해
      #   여기 넣은 그 스텝이, 진단된 상태 그대로 살아 있었다.
      #
      #   픽스처 워크스페이스로는 못 고친다(실측 기각 — 근거는 `testkit.rs` 머리주석):
      #   이 검사들은 폴더 존재가 아니라 **내용**을 단언하고, 파이썬 도구는 애초에 다른
      #   저장소에 있다. 빈 껍데기로 통과시키면 그게 정확히 "녹색인데 아무것도 안 쟀다"다.
      #   → 스위치를 켜서 **그 6종만** 명시적으로 끄고, 건너뛴 사실은 `--show-output` 으로
      #   로그에 남긴다. 스위치는 자기 자신도 검사한다(실물이 잡히는데 켜져 있으면 실패).
      - run: npm run tauri:test
        env:
          LEARNING_HUB_NO_REAL_ENV: '1'
      # tauri build 는 `web` 빌드를 자동 선행한다(beforeBuildCommand) → 번들까지 실제로 만들어 본다.
      # `cargo check` 만으로는 1단계에서 겪은 WiX/NSIS 번들 실패를 못 잡는다.
      #
      # ⚠⚠ **일회용 서명키를 여기서 만든다(2026-08-02).** `createUpdaterArtifacts: true` 라서 이
      #   스텝은 `TAURI_SIGNING_PRIVATE_KEY` 없이는 **원리적으로 통과할 수 없다.** 그리고 진짜
      #   개인키는 **일부러 GitHub 에 두지 않는다** — `릴리스.md` 가 그 판단을 이미 내렸다
      #   (*"저장소·조직이 침해되면 서명 능력이 함께 간다 … 지금은 일부러 로컬"*).
      #   두 결정이 정면으로 부딪혀 있었고, 그 결과가 C2 의 재발이다: 2026-08-01 실행에서
      #   `cargo test`(C2-①)·`cloud-server`(②)·`secret-scan`(③)이 전부 되살아났는데 **`npm run e2e`
      #   174케이스는 여전히 skipped** 였다. 병목이 사라진 게 아니라 한 스텝 뒤로 옮겨갔을 뿐이다.
      #
      #   → 매 실행마다 **버리는 키**를 만들어 서명한다. 셋 다 지킨다: 번들(NSIS)·서명 경로가
      #     실제로 돌고, 진짜 키는 로컬에 남고, 뒤 스텝이 skip 되지 않는다.
      #   ⚠ **키가 안 맞는 것이 안전장치다.** tauri 는 경고만 내고 진행하며(실측 2026-08-02),
      #     그 경고가 말하는 *"런타임에 수락되지 않는다"* 가 곧 이 산출물이 **진짜 업데이트로
      #     위장할 수 없다**는 뜻이다. CI 는 인스톨러를 업로드하지도 않는다(아래 upload-artifact
      #     는 `if: failure()` + playwright 리포트뿐).
      #   ⚠ 그래서 **이 스텝은 "업데이트를 낼 수 있는가"를 검증하지 않는다.** 그건 로컬
      #     릴리스 절차(`릴리스.md`)와 배포 후 content-type 확인(C1)이 계속 소유한다.
      - name: 번들 — 일회용 서명키(CI 전용 · 진짜 키는 로컬에만 있다)
        run: |
          npm run tauri -- signer generate -w ci-updater.key -p "" --force
          $env:TAURI_SIGNING_PRIVATE_KEY = Get-Content ci-updater.key -Raw
          $env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD = ""
          npm run tauri:build

      # ── 시각 회귀(2026-07-25 신설) ───────────────────────────────────────────
      # 종전에 CI 밖이던 유일한 게이트다. 이유는 정당했다 — 베이스라인 106장이 **win32**
      # 라 ubuntu 잡에서는 원리적으로 못 돈다. 그런데 그 결론이 "CI 에서 안 돈다"로 굳으면서
      # **앱의 주 UI 안전망이 '누가 로컬에서 기억하고 돌리는가'에 걸려 있었다.**
      # 커버리지가 UI 레이어에서 얇다는 사실(로드맵: "엔진/lib은 커버, UI는 e2e 시각만")과
      # 겹치면 구멍이 정확히 겹친다: UI 는 단위 커버리지도 얇고 CI 시각 검증도 없었다.
      #
      # 해법은 새 러너가 아니라 **이미 있는 windows 잡**이다(추가 과금 0 · 러너 OS 일치).
      # ⚠ 위치가 계약이다: `tauri:build` **뒤**여야 한다 — 그게 `web` 빌드를 선행하므로
      #   `dist` 가 갓 만들어진 상태이고, preview 는 그 `dist` 를 띄운다(옛 산출물에 스냅샷을
      #   찍는 함정은 `playwright.config.ts` 의 `reuseExistingServer:false` 주석이 소유).
      #
      # ⚠⚠ **첫 실행에서 실패할 수 있고, 그건 앱 회귀가 아닐 수 있다.** 베이스라인은 개발자
      #   PC 에서 찍혔고 러너는 폰트 렌더·서브픽셀 AA 가 다를 수 있다. 임계 0.5% 가 그 여유를
      #   덮도록 잡혀 있지만(§ config 주석) 실측 전에는 단언할 수 없다. 실패하면 아래 아티팩트의
      #   diff 이미지를 **먼저 보고** 판단할 것 — 러너 렌더 차이면 베이스라인을 러너에서
      #   재생성하지 말고(그러면 로컬이 영구히 빨간불이 된다) 이 스텝을 `e2e:smoke` 수준으로
      #   낮추거나 Playwright 도커 이미지로 양쪽을 통일하는 쪽이 맞다.
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm run e2e
        working-directory: web
      # 실패했을 때 **눈으로 볼 수 있어야** 위 판단이 가능하다. 실패 시에만 올린다.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-report
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 7
