# 러닝허브 웹앱 품질 게이트 (GitHub Actions).
# web/ 경로 변경 push/PR에 트리거 + 수동 실행(workflow_dispatch).
# (2026-07-12 워크스페이스 재구조화 P1: cowork 모노레포에서 서브모듈로 분리 →
#  경로가 러닝허브/web → web 로 바뀜. 부모 repo의 web-ci를 이관.)
name: web-ci

on:
  push:
    paths: ['web/**', 'src-tauri/**', 'server/**', 'package.json', '.github/workflows/ci.yml']
  pull_request:
    paths: ['web/**', 'src-tauri/**', 'server/**', 'package.json', '.github/workflows/ci.yml']
  workflow_dispatch: {}

jobs:
  # 웹 게이트 — OS 무관이라 ubuntu(저렴). 아래 shell 잡과 **일부러 분리**한다(설계 §6):
  # 린트·타입·테스트는 Rust 툴체인이 필요 없고, windows 러너는 2배 과금이다.
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # format:check — verify 구성요소인데 CI 에만 빠져 있던 비대칭(감사 2026-07-16 ②#29):
      # 포맷 위반이 --no-verify·웹UI 커밋으로 들어오면 CI 가 통과시켰다. codegen:check 는
      # hub 단독 체크아웃엔 부모 스키마가 없어 graceful skip 이라 CI 추가 실익 없음(의도적 제외).
      - run: npm run format:check
      - run: npm run test:coverage
      - run: npm run build
      # 번들 예산 게이트 — 빌드 직후 dist/assets를 gzip으로 재어 청크/총합 상한 초과를 잡는다.
      - run: npm run budget
      # Playwright 스모크(시각 비교 없음 → OS 독립적, 안정). 빌드물(dist)을 preview로 띄워 검사.
      # 비주얼 회귀(visual.spec)는 win32 베이스라인이라 CI(ubuntu)서 제외 — 로컬/수동 유지.
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e:smoke

  # 시크릿 스캔 — 설계서 §5-2 가 "인증 자료를 다루기 시작하는데 시크릿 스캔이 없다"고 적은 항목.
  # C-4 로 실제로 그 자료가 생겼다(HUB_SIGNING_KEY·HUB_ADMIN_KEY·리프레시 토큰). 이 저장소가
  # 지키는 규약은 "비밀은 `wrangler secret` 과 `.dev.vars`(gitignore)에만 둔다"인데, 규약을
  # 관습에 두면 흘러내린다는 게 이 저장소의 반복된 결론이다(stylelint 도입 근거와 같다).
  #
  # ⚠ 마켓플레이스 액션(`gitleaks/gitleaks-action`)을 쓰지 않는다 — 시크릿을 보겠다고
  #   저장소 전체를 읽는 서드파티 액션에 권한을 주는 것은 방어와 방향이 반대다. 대신
  #   **버전을 핀 고정한 릴리스 바이너리**를 받아 돈다(체크섬까지 대조). 신뢰면이 늘지 않는다.
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 전 이력을 본다 — 지금 지웠어도 과거 커밋에 남아 있으면 유출이다
      - name: gitleaks 설치(버전 핀 + 체크섬 대조)
        run: |
          set -euo pipefail
          VER=8.28.0
          BASE="https://github.com/gitleaks/gitleaks/releases/download/v${VER}"
          curl -sSL --fail -o gitleaks.tar.gz "${BASE}/gitleaks_${VER}_linux_x64.tar.gz"
          curl -sSL --fail -o checksums.txt "${BASE}/gitleaks_${VER}_checksums.txt"
          # ⚠ 대조를 **실제로** 한다. 안 하면 "핀 고정했다"는 말이 태그만 고정한 것이 된다.
          grep "gitleaks_${VER}_linux_x64.tar.gz" checksums.txt | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks version
      - name: 스캔
        run: ./gitleaks detect --source . --redact --verbose --exit-code 1

  # 클라우드 백엔드(Cloudflare Worker) — **종전까지 CI 가 전혀 안 돌던 폴더다**(2026-07-20 감사).
  # 워크플로 상단 paths 에 `server/**` 가 없었고 잡도 없어서, 인터넷에 노출되는 코드가
  # 로컬에서만 검증됐다. 인증·입력검증을 다루는 층이라 그 비대칭이 가장 위험한 곳에 있었다.
  #
  # ⚠ `test:roundtrip` 이 이 잡의 핵심이다 — **진짜 workerd + 진짜 D1** 위에서 온보딩→토큰→
  #   push→pull→폐기를 왕복한다. 이 저장소는 "정적 검사 전량 녹색인데 실물에서 죽는" 부류에
  #   네 번 물렸고(2단계 저장·C-4 삭제부활·C-5 CSP·pull 페이지네이션), 그때마다 문서는
  #   "띄워보지 않으면 모른다"고 적었지만 그 층을 만들지는 않았다. 여기가 그 층이다.
  #   ubuntu 로 충분하다(workerd 는 OS 독립적이고 GUI 가 없다).
  cloud-server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      # typecheck + format:check + 계약(SQL 의미론) + 왕복(실 workerd·D1)
      - run: npm run verify

  # Tauri 셸 — **windows 전용**. ubuntu 에서는 검증이 원리적으로 불가한 것들이 있다:
  # `killTree`(손자 taskkill /T) · `port_owner_pid`(netstat 파싱) · WebView2 자체가 Windows API 다.
  # 배포 매트릭스는 두지 않는다 — 이 앱은 Windows 단일 타깃이다(설계 §6).
  # ⚠ windows 러너는 2배 과금이라 비용 억제가 설계의 일부다:
  #   · rust-cache 로 의존성 재컴파일을 없앤다(없으면 매번 ~90초 풀빌드)
  #   · ⚠ GitHub 은 **잡별 paths 필터가 없다** — 워크플로 상단 paths 는 워크플로 전체에 걸리므로
  #     `web/**` 만 바뀌어도 이 잡이 돈다. 낭비만은 아니다(번들이 web/dist 를 품으므로 web
  #     변경도 셸 산출물을 바꾼다). 과금이 부담되면 `dorny/paths-filter` 로 잡을 게이팅할 것.
  #   · 트랙 B(e2e:shell)는 **여기서 돌리지 않는다** — 창을 띄우고 python·Ollama 를 실제로
  #     부르는 통합 테스트라 헤드리스 러너에서 flaky 해지기 쉽고, 그 대가로 얻는 신호를 로컬
  #     `/게이트`가 이미 준다. CI 는 "컴파일·린트·번들이 되는가"까지만 책임진다.
  shell-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # windows 러너 과금이 2배라 캐시가 선택이 아니다(설계 §6 명시).
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # 루트와 web 양쪽 설치가 필요하다: `tauri:*` 는 **루트 스크립트**라 루트의 @tauri-apps/cli 를
      # 쓰고, `tauri:build` 의 beforeBuildCommand(`npm --prefix web run build`)는 web 의존성을 쓴다.
      - run: npm ci
      - run: npm ci
        working-directory: web
      - run: npm run tauri:fmt
      - run: npm run tauri:clippy
      # Windows 전용 계약(taskkill /T 손자 정리 · WebView2)은 이제 **Rust 쪽에 있다** —
      # `cargo test` 가 위 tauri:clippy 와 같은 잡에서 돈다. 4단계-G 에서 serve.js 와 함께
      # `npm run test -- serve` 를 지웠다(그 26케이스의 처지는 설계 문서 대조표 참조).
      - run: cargo test --manifest-path src-tauri/Cargo.toml --lib
      # tauri build 는 `web` 빌드를 자동 선행한다(beforeBuildCommand) → 번들까지 실제로 만들어 본다.
      # `cargo check` 만으로는 1단계에서 겪은 WiX/NSIS 번들 실패를 못 잡는다.
      - run: npm run tauri:build
